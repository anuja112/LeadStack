<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Lead Stack</title>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <svg class="logo-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 2L2 7L10 12L18 7L10 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 13L10 18L18 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div>
                    <h1 class="title">Lead Tracker</h1>
                    <p class="subtitle">Save and organize your leads</p>
                </div>
            </div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
                <svg class="theme-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="sun-icon" d="M10 3V1M10 19V17M17 10H19M1 10H3M15.657 4.343L17.071 2.929M2.929 17.071L4.343 15.657M15.657 15.657L17.071 17.071M2.929 2.929L4.343 4.343M14 10C14 12.2091 12.2091 14 10 14C7.79086 14 6 12.2091 6 10C6 7.79086 7.79086 6 10 6C12.2091 6 14 7.79086 14 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path class="moon-icon" d="M19 11.5C18.0444 12.3329 16.8056 12.8219 15.5 12.8219C12.4624 12.8219 10 10.3595 10 7.32192C10 6.01636 10.489 4.77755 11.3219 3.82192C7.75 4.49692 5 7.62692 5 11.3219C5 15.4639 8.35786 18.8219 12.5 18.8219C16.195 18.8219 19.325 16.0719 20 12.4999C19.8267 12.1833 19.4233 11.8167 19 11.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats">
        <span id="stats-text">0 Leads</span>
    </div>

    <!-- Input Section -->
    <div class="input-section">
        <input type="url" id="input-el" placeholder="Enter URL to save..." aria-label="URL input">
        <div class="button-group">
            <button id="input-btn" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 5V15M5 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Save Input
            </button>
            <button id="tab-btn" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M7 10L10 13L13 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Save Tab
            </button>
        </div>
    </div>

    <!-- Filter/Search Section -->
    <div class="filter-section">
        <div class="search-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2"/>
                <path d="M13 13L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="text" id="search-el" placeholder="Search saved leads..." aria-label="Search leads">
        </div>
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="favorites">Favorites</button>
        </div>
    </div>

    <!-- Leads List -->
    <div class="leads-container">
        <div id="empty-state" class="empty-state">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
                <path d="M24 16V32M16 24H32" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <p class="empty-title">Your leads will appear here</p>
            <p class="empty-subtitle">Save a URL or the current tab to get started</p>
        </div>
        <ul id="ul-el" class="leads-list"></ul>
    </div>

    <!-- Actions Bar -->
    <div class="actions-bar">
        <button id="export-btn" class="btn-text">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 13V15C17 16.1046 16.1046 17 15 17H5C3.89543 17 3 16.1046 3 15V13M10 3V13M10 3L6 7M10 3L14 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Export
        </button>
        <button id="import-btn" class="btn-text">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 13V15C17 16.1046 16.1046 17 15 17H5C3.89543 17 3 16.1046 3 15V13M10 13V3M10 13L6 9M10 13L14 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Import
        </button>
        <button id="open-all-btn" class="btn-text">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4H10V10H4V4Z" stroke="currentColor" stroke-width="2"/>
                <path d="M12 4H18V10H12V4Z" stroke="currentColor" stroke-width="2"/>
                <path d="M4 12H10V18H4V12Z" stroke="currentColor" stroke-width="2"/>
            </svg>
            Open All
        </button>
        <button id="delete-btn" class="btn-text btn-danger">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 5H17M8 5V3H12V5M8 9V15M12 9V15M5 5L6 17H14L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Delete All
        </button>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Hidden file input for import -->
    <input type="file" id="file-input" accept=".json" style="display: none;">

    <script src="index.js"></script>
</body>
</html>
